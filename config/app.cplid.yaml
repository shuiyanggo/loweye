# 低空之眼 · CPLID 微调权重配置（真实缺陷类别检测）
#
# 用途：用 tools/train_cplid.py 在 CPLID 上微调出来的权重（torchvision Faster R-CNN +
# MobileNetV3，BSD-3；先 COCO 预训练再换 3 类检测头）跑评测，拿到**真实的每类漏检率**。
#
# 为什么走 torch 后端而不是 ONNX：Faster R-CNN 的 ROI Align + NMS 后处理导出 ONNX 麻烦，
# 先用 torch 权重把指标测出来，导出另做（ONNX 通道已用 RTMDet-tiny 验证可用）。
#
# 用法：
#   python -m tools.eval_detection --config config/app.cplid.yaml \
#     --images data/external/cplid/Defective_Insulators/images \
#     --labels data/external/cplid/Defective_Insulators/labels/defect

app:
  name: 低空之眼
  subtitle: 低空巡检决策层软件（CPLID 微调权重评测）
  version: 0.1.0
  trace_retention: 200

paths:
  data_raw: data/raw
  data_processed: data/processed
  index_dir: data/index
  assets: data/assets
  uploads: data/uploads
  out: out
  web: web

retrieval:
  bm25_top_k: 30
  vector_top_k: 30
  fused_top_k: 20
  final_top_k: 5
  rrf_k: 60
  min_relevance: 0.18
  require_clause_no: true
  embedder: hashing_tfidf
  embed_dim: 4096
  embedder_model: BAAI/bge-m3
  embedder_model_path: null
  reranker: lexical
  reranker_model: BAAI/bge-reranker-v2-m3
  reranker_model_path: null
  lexicon: config/lexicon.yaml
  scene_docs:
    power: [demo_line_guide]
    agriculture: [demo_crop_guide]
    emergency: [demo_emergency_plan, demo_line_guide]

detect:
  detector: torch
  torch_path: models/detector/cplid_insulator_fasterrcnn.pth
  class_names: [insulator, defect]
  input_size: 640
  nms_iou: 0.50
  conf_threshold: 0.35
  human_review_threshold: 0.60
  model_version: cplid-frcnn-mnv3
  threads: 8                    # 限制线程数，别把同时在跑的演示服务拖垮
  slice:
    enabled: true               # 缺陷框只占 0.3% 面积，必须靠切片把目标放大（见 7.6 节消融）
    size: 640
    overlap: 0.2
  infer_min_size: 640           # 推理短边；与切片尺寸对齐，避免瓦片再被缩小
  infer_max_size: 640

llm:
  provider: template
  base_url: null
  api_key_env: LOWEYE_LLM_API_KEY
  model: null
  timeout_s: 20
  max_retries: 1

tools:
  workorder:
    enabled: false
  notify:
    enabled: false
    webhook_url_env: LOWEYE_NOTIFY_WEBHOOK
    timeout_s: 5
  weather:
    enabled: false
    api_key_env: LOWEYE_WEATHER_KEY
  report:
    enabled: true
    template: config/report_template.html

severity:
  rules_file: config/routes.yaml

eval:
  goldset: eval/gold_qa.yaml
  arm_b_mode: scripted

server:
  host: 127.0.0.1
  port: 8850
