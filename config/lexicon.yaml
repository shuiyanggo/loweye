# 领域术语表（现场口语 → 规程术语）
#
# 为什么需要它：巡检一线的人不会照着规程原文提问。他说「塔上那串瓷瓶碎了一片」，
# 文档里写的是「绝缘子自爆」。纯词法检索（BM25 + 字符 n-gram）在这种词面不对齐的
# 提问上会直接失分 —— 这不是调阈值能解决的，降阈值只会让错误条款被当成依据。
#
# 用途（检索前的一次查询归一化 + 扩展，不改动知识库原文）：
#   1) 归一化：把提问里的口语说法替换成规范术语，使词面与文档对齐；
#   2) 扩展：把命中的规范术语追加到查询里，提高 BM25 的召回。
# 检索结果里会带上归一化后的查询串，用户能看到系统「听成了什么」。
#
# 维护约定：
#   - canonical 必须与知识库文档实际用词一致，否则扩了也没用；
#   - aliases 只收现场确实会说的说法，不收生造词；
#   - 单字别名只允许不会与常用词混淆的（塔、歪、砍、锈、烟、虫、苗）。
terms:
  - canonical: 绝缘子
    aliases: [瓷瓶, 瓷套, 绝缘串, 绝缘子串, 绝缘瓶, 碟子]
  - canonical: 自爆
