# 改写题（group: paraphrase）：刻意**不使用文档原词**，用现场口吻提问。
# 为什么单列一组：原词提问对任何检索方式都太容易（BM25 直接命中），
# 四组配置会一起满分，比不出差别；改写题才看得出「只靠词面」和
# 「词面+语义+重排」的区别。这一组的存在本身就是要防止把
# 「全部 100%」当成「检索策略有效」的证据。
  - id: P-01
    group: paraphrase
    question: 塔上那串瓷瓶碎了一片 要不要马上停电
    doc: demo_line_guide
