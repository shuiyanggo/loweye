# 金标问答集（M6 评估用）
#
# 用途：量化「检索是否准、拒答是否稳」，而不是靠感觉说「还行」。
# 判定口径（写死在 runner 里，避免临时改口径）：
#   命中 = 返回的前 k 条里出现 (doc, clause) 完全匹配的条款；
#   Recall@k = 命中问题的比例；MRR = 第一条命中排名的倒数均值。
#
# 两点必须诚实说明（报告里也会写）：
#   1) 这套题是项目自编的，条款来自 data/raw 下的演示占位文档（非任何标准原文），
#      所以它度量的是**本系统检索链路的行为**，不是行业权威答案的准确率；
#   2) 越界问题的期望结果是「拒答」，不是「答对」，因此不参与 Recall 统计。
#
# 域内问题：期望至少命中 clauses 里的任意一条（同一条款号在别的文档里出现不算命中，
# 因此必须用 doc 限定文档）。

in_scope:
