# 留出集（group: heldout）：**术语表定稿之后**才写的改写题，写之前没有再动词表。
# 存在的意义就是防止「在开发集上调出来的提升」被当成泛化能力：
# 这三组必须分开报（literal=原词 / paraphrase=开发集 / heldout=留出集），
# 留出集上的成绩才是这套检索策略对**没见过的说法**的真实表现。
