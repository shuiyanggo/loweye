# 越界问题：期望 covered=False（拒答）。
# 注意这里刻意混入了「看起来像本领域」但知识库确实没有依据的问法（如红外测温），
# 用来验证系统不会因为词面相近就硬凑一条条款出来。
out_of_scope:
  - id: X-01
    question: 今天股市行情怎么样
    why: 与巡检完全无关
  - id: X-02
